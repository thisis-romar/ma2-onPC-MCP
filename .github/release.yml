changelog:
  exclude:
    labels:
      - "dependencies"
      - "skip-changelog"
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Breaking Changes
      labels:
        - "breaking"
    - title: Security
      labels:
        - "security"
    - title: New MCP Tools
      labels:
        - "new-tool"
    - title: New Skills
      labels:
        - "new-skill"
    - title: Features
      labels:
        - "enhancement"
    - title: Bug Fixes
      labels:
        - "bug"
    - title: Documentation
      labels:
        - "documentation"
    - title: Other Changes
      labels:
        - "*"
