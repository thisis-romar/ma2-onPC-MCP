name: Tests

on:
  push:
    branches: [main, GrandMA2-Telnet-Buddy, "feat/**"]
  pull_request:
    branches: [main, GrandMA2-Telnet-Buddy]

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Verify private submodule credential
        shell: bash
        env:
          PRIVATE_SUBMODULE_PAT: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
        run: |
          if [[ -z "$PRIVATE_SUBMODULE_PAT" ]]; then
            echo "::error::Missing PRIVATE_SUBMODULE_PAT repository secret. Configure a read-only token for both repositories."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_PAT }}
          persist-credentials: false

      - name: Verify private submodule checkout
        shell: bash
        run: |
          for path in \
            src/private/tools_professional.py \
            src/private/tools_enterprise.py \
            src/private/server_orchestration_tools.py
          do
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Private submodule checkout is incomplete; verify PRIVATE_SUBMODULE_PAT access."
              exit 1
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check src/ tests/ rag/

      - name: Type check
        run: uv run mypy src/ rag/
        continue-on-error: true

      - name: Run tests
        run: uv run python -m pytest tests/ -v --tb=short -m "not live" --maxfail=50
        env:
          GMA_LICENSE_BYPASS: "1"
